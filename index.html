<!doctype html>
<html lang="ru" data-demo-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyContext — демо</title>
    <!-- Порядок подключения — требование брифа: демо идёт вторым, поверх
         библиотеки. Само перекрытие палитры держит не порядок, а вес селектора:
         правила демо — (0,3,0) против (0,2,0) у `styles/mycontext.css`, так что
         переставленные ссылки не изменили бы ничего. Разбор — в
         `Demo/demo.css`. -->
    <link rel="stylesheet" href="./styles/mycontext.css" />
    <link rel="stylesheet" href="./Demo/demo.css" />
  </head>
  <body>
    <header class="demo-header">
      <h1 class="demo-header__title">MyContext</h1>
      <p class="demo-header__lead">
        Контекстные меню на чистом ES-модуле: без рантайм-зависимостей, с Top Layer,
        неограниченной вложенностью подменю и полной клавиатурной навигацией.
        Правый клик по любому блоку ниже открывает его меню.
      </p>
      <button type="button" class="demo-theme-toggle" data-theme-toggle aria-pressed="false">
        Тёмная тема
      </button>
    </header>
    <main class="demo-scenarios">
      <section class="demo-scenario" data-scenario="basic"></section>
      <section class="demo-scenario" data-scenario="nested"></section>
      <section class="demo-scenario" data-scenario="disabled"></section>
      <section class="demo-scenario" data-scenario="hidden"></section>
      <section class="demo-scenario" data-scenario="icons"></section>
      <section class="demo-scenario" data-scenario="long"></section>
      <section class="demo-scenario" data-scenario="scale"></section>
      <section class="demo-scenario" data-scenario="autohide"></section>
      <section class="demo-scenario" data-scenario="press"></section>
      <section class="demo-scenario" data-scenario="press-left"></section>
      <section class="demo-scenario" data-scenario="dismissible"></section>
      <section class="demo-scenario" data-scenario="mixed"></section>
      <section class="demo-scenario" data-scenario="focus"></section>
    </main>
    <script type="module" src="./Demo/demo.js"></script>
  </body>
</html>
